<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resilient Component</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Live Data</h1>

    <section class="food-list" aria-label="Food recommendations">
      <article class="food-card">
        <h2>Pho Bo</h2>

        <div class="metadata">
          <span class="badge">Vietnamese</span>
          <span class="badge">Lunch</span>
          <span class="badge">~$2</span>
        </div>

        <p>Traditional Vietnamese beef noodle soup.</p>
      </article>

      <article class="food-card">
        <h2>Ramen</h2>

        <div class="metadata">
          <span class="badge">Japanese</span>
          <span class="badge">Dinner</span>
          <span class="badge">~$4</span>
        </div>

        <p>Japanese noodle soup with rich broth.</p>
      </article>

      <article class="food-card">
        <h2>Bibimbap</h2>

        <div class="metadata">
          <span class="badge">Korean</span>
          <span class="badge">Lunch</span>
          <span class="badge">~$3</span>
        </div>

        <p>Korean rice bowl with vegetables and beef.</p>
      </article>
    </section>
  </main>
</body>
</html>
