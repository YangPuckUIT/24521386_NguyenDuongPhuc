<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Delegation Test</title>
</head>
<body>
  <main id="root">
    <h2>Event Delegation Test</h2>

    <button data-action="add-task">
      <span>Add Task</span>
    </button>

    <p id="result">Waiting for click...</p>
  </main>

  <script type="module">
    import {
      attachRootEventDelegation
    } from "./reactive-engine.js";

    const root = document.querySelector("#root");
    const result = document.querySelector("#result");

    attachRootEventDelegation(root);

    root.addEventListener("task-action", (event) => {
      result.textContent = `Received action: ${event.detail.action}`;
      console.log("Delegated action:", event.detail.action);
    });
  </script>
</body>
</html>
