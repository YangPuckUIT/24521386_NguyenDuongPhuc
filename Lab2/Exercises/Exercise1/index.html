
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f7fb">
  <title>Virtual DOM Playground | Lab 2</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f5f7fb;
      color: #172033;
      font-family: "Segoe UI", sans-serif;
    }

    .page {
      width: min(760px, calc(100% - 32px));
      margin: 64px auto;
    }

    .eyebrow {
      color: #2563eb;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    h1 {
      margin: 12px 0;
      font-size: clamp(30px, 5vw, 44px);
      letter-spacing: -1.5px;
    }

    .description {
      color: #64748b;
      line-height: 1.7;
    }

    #app {
      margin-top: 32px;
    }

    .hero {
      padding: 28px;
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgb(15 23 42 / 5%);
    }

    .hero h1 {
      font-size: 26px;
      letter-spacing: -0.5px;
    }

    .hero p {
      overflow-wrap: anywhere;
      color: #64748b;
      line-height: 1.7;
    }

    button {
      margin-top: 20px;
      padding: 12px 20px;
      border: 0;
      border-radius: 9px;
      background: #2563eb;
      color: white;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }

    button:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
    }

    button:focus-visible {
      outline: 3px solid #93c5fd;
      outline-offset: 3px;
    }

    footer {
      margin-top: 28px;
      color: #94a3b8;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div class="eyebrow">Lab 2 / Exercise 1</div>
      <h1>Virtual DOM Playground</h1>
      <p class="description">
        A lightweight rendering engine built from scratch.
        Explore how virtual nodes become real DOM elements.
      </p>
    </header>

    <section id="app" aria-label="Rendered application"></section>

    <footer>
      JavaScript · Virtual DOM · DOM Rendering
    </footer>
  </main>

  <script type="module" src="./test-runner.js"></script>
</body>
</html>
